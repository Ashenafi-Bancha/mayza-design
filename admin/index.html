<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mayza Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17110f">
  <link rel="icon" href="../images/logo-red-160.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;600&family=Noto+Serif+Ethiopic:wght@500;600&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="root" aria-live="polite"><div class="boot"><img src="../images/logo-red-160.webp" alt="" width="56" height="56"></div></div>
  <div id="drawer" class="drawer-wrap" hidden>
    <div class="scrim" data-action="close-drawer"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">The admin needs JavaScript turned on.</p></noscript>

  <script src="../js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
